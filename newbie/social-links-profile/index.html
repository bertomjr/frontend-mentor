<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css">
  
  <title>Frontend Mentor | Social links profile</title>

</head>

<body>
  
  <main>
    <article class="profile-card">
      <header class="profile-header">
        <img src="./assets/images/avatar-jessica.jpeg" alt="" width="88" height="88" />
        <hgroup class="profile-info">
          <h1 class="txt-p1">Jessica Randall</h1>
          <p class="txt-p2b">London, United Kingdom</p>
          <p class="txt-p2">"Front-end developer and avid reader."</p>
        </hgroup>
      </header>
      <nav class="social-links">
        <a class="txt-p2b" href="https://github.com/">GitHub</a>
        <a class="txt-p2b" href="https://www.frontendmentor.io/">Frontend Mentor</a>
        <a class="txt-p2b" href="https://www.linkedin.com/">LinkedIn</a>
        <a class="txt-p2b" href="https://twitter.com/">Twitter</a>
        <a class="txt-p2b" href="https://www.instagram.com/">Instagram</a>
      </nav>
    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/bertomjr">@bertomjr</a>.
  </footer>
</body>
</html>
