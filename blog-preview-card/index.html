<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | Blog preview card</title>

</head>
<body>

  <main>

    <article class="blog-card">
      <img class="blog-card-image" src="./assets/images/illustration-article.svg" alt="" />
      <p class="blog-card-category txt-p3b">Learning</p>

      <p class="txt-p3">Published <time datetime="2023-12-21">21 Dec 2023</time></p>

      <h1 class="txt-p1">HTML & CSS foundations</h1>

      <p class="txt-p2">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      
      <section class="blog-card-author">
      <img src="./assets/images/image-avatar.webp" alt="Greg Hooper" class="blog-card-avatar" />
      <p class="txt-p3b">Greg Hooper</p>
      </section>
    </article>

  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/bertomjr">Roberto Marcillo Jr</a>.
  </footer>

</body>
</html>
