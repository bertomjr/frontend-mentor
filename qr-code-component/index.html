<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <main>
    <article class="qr-code-container">
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">
        <img id="qr-code" src="./images/image-qr-code.png" alt="QR Code linking to Frontend Mentor" />
      </a>
      <h1 class="text-preset1" >Improve your front-end skills by building projects</h1>
      <p class="text-preset2">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
    </article>

  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge"> Frontend Mentor</a>. 
    Coded by <a href="https://github.com/bertomjr"> Roberto Marcillo Jr</a>.
  </footer>
</body>
</html>
